[project]
name = "globalwatch-backend"
version = "0.1.0"
description = "API do assistente geoespacial Global Watch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pyjwt[crypto]>=2.15,<3",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "shapely>=2.2,<3",
    "pyproj>=3.8,<4",
    "pillow>=12.3,<13",
    "rasterio>=1.5.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<1",
]
# Scripts de pesquisa em `scripts/` (calibração, comparações); fora da imagem de produção.
scripts = [
    "matplotlib>=3.11,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# A fonte do rodapé de polygons.png precisa ir junto na instalação.
[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
