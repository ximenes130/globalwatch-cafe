[project]
name = "globalwatch-backend"
version = "0.1.0"
description = "API do assistente geoespacial Global Watch"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pyjwt[crypto]>=2.15,<3",
    "numpy>=2.5,<3",
    "rasterio>=1.5.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
