# Execução local (specs/001, R1.12).
#   docker compose up --build                  → API em :8000 e front em :5173
#   docker compose --profile test run --rm rls-test → migration + teste de RLS
# Banco e login usam o Supabase real: preencha backend/.env e frontend/.env.local
# a partir dos respectivos .env.example.

services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/srv/app:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Binários nativos (Vite, oxlint) do container separados dos do host.
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  db-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  rls-test:
    profiles: [test]
    image: postgres:17-alpine
    command: /supabase/tests/run.sh
    environment:
      PGHOST: db-test
      PGUSER: postgres
      PGPASSWORD: test
    volumes:
      - ./supabase:/supabase:ro
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  web_node_modules:
